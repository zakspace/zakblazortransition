name: Publish NuGet Package

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    
    # REQUIRED for Trusted Publishing / OIDC token generation
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Pack project
        run: dotnet pack --configuration Release --no-restore --output ./nupkg

      # Exchange OIDC token for a temporary secure API key
      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: abdulskdesign # Your exact NuGet.org username

      - name: Publish to NuGet.org
        run: |
          dotnet nuget push "./nupkg/*.nupkg" \
            --source "https://api.nuget.org/v3/index.json" \
            --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
            --skip-duplicate